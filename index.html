<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101212"><meta name="description" content="灰燼協定：為觸控打造的科幻回合制戰術 roguelike。每一步，都有代價。">
  <title>ASH PROTOCOL — 灰燼協定</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./assets/icon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./expansion.css">
</head>
<body class="booting">
<div class="boot-screen" aria-hidden="true"><span class="boot-line">INITIALIZING</span><span class="boot-slow">載入時間較長。若畫面停住，請重新整理或檢查網路。</span></div>
<div class="app"><main class="workspace">
<section class="battle-panel" aria-label="戰術作戰介面">
<div class="viewport" id="viewport"><canvas id="battle" aria-label="四方向俯視戰場：點相鄰格移動，點擊敵人或可破壞物鎖定" tabindex="0"></canvas><div class="low-health" id="low-health" aria-hidden="true"></div><div class="vitals-bar"><div class="mobile-health"><span>生命</span><b id="mobile-hp">100 / 100</b><div><i id="mobile-hp-bar"></i></div><span class="plates">護甲</span><b class="plates" id="mobile-plates">0 / 30</b><div class="plates"><i id="mobile-plates-bar"></i></div></div><span id="level">LV. 01</span><div class="map-tools"><button class="map-button" data-action="center" aria-label="鏡頭復位">⌖</button><button class="map-button" data-action="zoomOut" aria-label="縮小地圖">−</button><button class="map-button" data-action="zoomIn" aria-label="放大地圖">+</button><button class="map-button" data-action="map" aria-label="開啟樓層地圖">▦</button></div></div>
<svg id="target-link" class="target-link" aria-hidden="true" hidden><path></path></svg><div id="target-card" class="target-card" role="region" aria-label="鎖定目標資訊" hidden><strong id="target-name"></strong><span id="target-detail"></span><b id="target-range"></b><span id="target-distance"></span><span id="target-cover"></span><span id="target-traits" class="target-traits"></span><span id="target-order" class="target-order"></span><span id="target-state" class="target-state"></span></div>
</div>
<div class="tactical-panel">
<div class="battle-header"><button id="sector-title" data-action="mission" aria-label="查看任務目標">01 / 核心撤離</button><span class="turn-indicator">回合 <b id="turn">001</b></span><button class="map-button" data-action="settings" aria-label="開啟選單與設定">☰</button></div>
<div class="loadout-bar"><div><span id="quick-weapon">AR–09 · 8 / 48</span><span id="status-effects"></span></div><button data-action="cycleTarget" aria-label="切換鎖定目標">⌖ 目標</button><button data-action="toggleTargeting" aria-label="關閉瞄準資訊" aria-pressed="true" title="瞄準資訊開關（Q），不耗回合">瞄準</button><button data-action="bag" aria-label="開啟背包">▣ 背包</button></div>
<div class="control-deck"><div class="direction-pad" aria-label="移動與等待"><button data-move="0,-1" class="north" aria-label="向上移動">↑</button><button data-move="-1,0" class="west" aria-label="向左移動">←</button><button data-action="wait" class="wait" aria-label="等待：本回合直接傷害減半、被射擊命中率減15，下次射擊命中加15" title="等待：減傷50%、閃避15、下次射擊命中+15"><span>◷</span><small>等待</small></button><button data-move="1,0" class="east" aria-label="向右移動">→</button><button data-move="0,1" class="south" aria-label="向下移動">↓</button></div>
<div class="action-buttons"><button class="action primary" data-action="fire"><span class="action-icon">⌖</span><strong>開火</strong></button><button class="action" data-action="reload"><span class="action-icon">⟳</span><strong>裝填</strong></button><button class="action" data-action="grenade"><span class="action-icon">◉</span><strong id="grenade-label">破片彈 2</strong></button><button class="action" data-action="item"><span class="action-icon">✚</span><strong>醫療包 2</strong></button><button class="action" data-action="skill" disabled aria-label="技能未預備" title="到背包預備技能"><span class="action-icon">◇</span><strong>技能未預備</strong></button><button class="action" id="interact" data-action="interact"><span class="action-icon">⇩</span><strong>電梯</strong></button></div>
</div>
<div id="field-messages" aria-label="戰術提示"></div>
</div></section></main></div>
<dialog id="modal"><div id="modal-content"></div></dialog>
<dialog id="orientation-guard" aria-labelledby="orientation-title"><div><span aria-hidden="true">↻</span><h2 id="orientation-title">請轉回直向遊玩</h2><p>目前回合與選單已保留。</p></div></dialog>
<input type="file" id="import-backup" accept=".json,application/json" hidden>
<input type="file" id="import-save" accept=".json,application/json" hidden><script type="module" src="./src/main.js"></script>
</body></html>
