<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101212"><meta name="description" content="灰燼協定：為觸控打造的科幻回合制戰術 roguelike。每一步，都有代價。">
  <title>ASH PROTOCOL — 灰燼協定</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./assets/icon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./expansion.css">
</head>
<body class="booting">
<div class="boot-screen" aria-hidden="true"><span class="boot-line">INITIALIZING</span><span class="boot-slow" data-i18n="index.bootSlow">載入時間較長。若畫面停住，請重新整理或檢查網路。<br>Loading is taking a while. If the screen stays stuck, reload or check your connection.</span></div>
<div class="app"><main class="workspace">
<section class="battle-panel" aria-label="戰術作戰介面" data-i18n-aria="index.panel">
<div class="viewport" id="viewport"><canvas id="battle" aria-label="四方向俯視戰場：點相鄰格移動，點擊敵人或可破壞物鎖定" data-i18n-aria="index.field" tabindex="0"></canvas><div class="low-health" id="low-health" aria-hidden="true"></div><div class="vitals-bar"><div class="mobile-health"><span data-i18n="index.hp">生命</span><b id="mobile-hp">100 / 100</b><div><i id="mobile-hp-bar"></i></div><span class="plates" data-i18n="index.plates">護甲</span><b class="plates" id="mobile-plates">0 / 30</b><div class="plates"><i id="mobile-plates-bar"></i></div></div><span id="level">LV. 01</span><div class="map-tools"><button class="map-button" data-action="center" aria-label="鏡頭復位" data-i18n-aria="hotkeyActions.center.label">⌖</button><button class="map-button" data-action="zoomOut" aria-label="縮小地圖" data-i18n-aria="index.zoomOut">−</button><button class="map-button" data-action="zoomIn" aria-label="放大地圖" data-i18n-aria="index.zoomIn">+</button><button class="map-button" data-action="map" aria-label="開啟樓層地圖" data-i18n-aria="index.openMap">▦</button></div></div>
<svg id="target-link" class="target-link" aria-hidden="true" hidden><path></path></svg><div id="target-card" class="target-card" role="region" aria-label="鎖定目標資訊" data-i18n-aria="index.targetCard" hidden><strong id="target-name"></strong><span id="target-detail"></span><b id="target-range"></b><span id="target-distance"></span><span id="target-cover"></span><span id="target-traits" class="target-traits"></span><span id="target-order" class="target-order"></span><span id="target-state" class="target-state"></span></div>
</div>
<div class="tactical-panel">
<div class="battle-header"><div id="field-messages" aria-label="戰術提示" data-i18n-aria="index.messages"></div><button id="save-warning" class="save-warning" data-action="saveWarning" hidden aria-label="存檔失敗，點此查看" data-i18n-aria="index.saveFailedAria" data-i18n="index.notSaved">⚠ 未存檔</button><span class="turn-indicator"><span data-i18n="index.turn">回合</span> <b id="turn">001</b></span><button class="map-button" data-action="settings" aria-label="開啟選單與設定" data-i18n-aria="index.menu">☰</button></div>
<div class="loadout-bar"><div><span id="quick-weapon">AR–09 · 8 / 48</span><span id="status-effects"></span></div><button data-action="weapons" aria-label="開啟武器分頁" data-i18n-aria="index.weaponsAria" title="直接開背包的武器分頁（I）" data-i18n-title="index.weaponsTitle" data-i18n="index.weapons">▤ 武器</button><button data-action="cycleTarget" aria-label="切換鎖定目標" data-i18n-aria="index.cycleTarget" data-i18n="index.target">⌖ 目標</button><button data-action="toggleTargeting" aria-label="關閉瞄準資訊" data-i18n-aria="controller.aim.off" aria-pressed="true" title="瞄準資訊開關（Q），不耗回合" data-i18n-title="index.aimTitle" data-i18n="index.aim">瞄準</button><button data-action="flashlight" aria-label="打開手電筒" data-i18n-aria="controller.flashlight.on" aria-pressed="false" title="手電筒開關（L），不耗回合" data-i18n-title="index.flashlightTitle">◐</button><button data-action="bag" aria-label="開啟背包" data-i18n-aria="index.bag" data-i18n="index.pack">▣ 背包</button></div>
<div class="control-deck"><div class="direction-pad" aria-label="移動與等待" data-i18n-aria="controller.deck.classic"><button data-move="0,-1" class="north" aria-label="向上移動" data-i18n-aria="hotkeyActions.moveUp.label">↑</button><button data-move="-1,0" class="west" aria-label="向左移動" data-i18n-aria="hotkeyActions.moveLeft.label">←</button><button data-action="wait" class="wait" aria-label="等待：本回合直接傷害減半、被射擊命中率減15，下次射擊命中加15" data-i18n-aria="index.waitAria" title="等待：減傷50%、閃避15、下次射擊命中+15" data-i18n-title="index.waitTitle"><span>◷</span><small data-i18n="deckLabels.wait">等待</small></button><button data-move="1,0" class="east" aria-label="向右移動" data-i18n-aria="hotkeyActions.moveRight.label">→</button><button data-move="0,1" class="south" aria-label="向下移動" data-i18n-aria="hotkeyActions.moveDown.label">↓</button></div>
<div class="action-buttons"><button class="action primary" data-action="fire"><span class="action-icon">⌖</span><strong data-i18n="controller.fire.label">開火</strong></button><button class="action" data-action="reload"><span class="action-icon">⟳</span><strong data-i18n="controller.reload.label">裝填</strong></button><button class="action" data-action="grenade"><span class="action-icon">◉</span><strong id="grenade-label">破片彈 2</strong></button><button class="action" data-action="item"><span class="action-icon">✚</span><strong>醫療包 2</strong></button><button class="action" data-action="skill" disabled aria-label="技能未預備" data-i18n-aria="index.skillNotReady" title="到背包預備技能" data-i18n-title="index.skillTitle"><span class="action-icon">◇</span><strong data-i18n="index.skillNotReady">技能未預備</strong></button><button class="action" id="interact" data-action="interact"><span class="action-icon">⇩</span><strong data-i18n="index.elevator">電梯</strong></button></div>
</div>
</div></section></main></div>
<div class="vhs-layer" aria-hidden="true"></div>
<dialog id="modal"><div id="modal-content"></div><div class="vhs-layer" aria-hidden="true"></div></dialog>
<dialog id="orientation-guard" aria-labelledby="orientation-title"><div><span aria-hidden="true">↻</span><h2 id="orientation-title" data-i18n="index.rotateTitle">請轉回直向遊玩</h2><p data-i18n="index.rotateKept">目前回合與選單已保留。</p><p class="orientation-note" data-i18n="index.rotateNote">觸控筆電或無法旋轉的裝置：</p><button class="modal-button secondary" id="orientation-continue" data-i18n="index.rotateContinue">仍以橫向繼續</button></div></dialog>
<input type="file" id="import-backup" accept=".json,application/json" hidden>
<input type="file" id="import-save" accept=".json,application/json" hidden>
<input type="file" id="import-replay" accept=".json,application/json" hidden><script type="module" src="./src/main.js"></script>
</body></html>
