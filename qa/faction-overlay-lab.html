<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>派系痕跡預覽</title>
<!-- Faction decal lab (3.139.0, docs/FACTION_DECALS.md). Draws real generated floors with the game's own Renderer and
     src/faction-decals.js, with the tuning and the list of cells left out overridable, so a change can be tried here and
     then handed to Claude as numbers and cell ids. Needs the dev server (npm start): http://localhost:5173/qa/faction-overlay-lab.html -->
<style>
 :root{--bg:#0f1716;--panel:#18231f;--ink:#dfe6d2;--dim:#8fa08e;--accent:#e2b35f;--line:#3a4a44;--kick:#ff7f6a;--back:#8fe0a6}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,'Noto Sans TC',sans-serif;height:100vh;display:flex;flex-direction:column}
 header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
 header h1{font-size:15px;margin:0 0 6px;color:var(--accent)}
 .row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:4px 0}
 .group{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding-right:14px;border-right:1px solid var(--line)}
 .group:last-child{border-right:0}
 .group>b{color:var(--dim);font-weight:600;font-size:12px}
 label{display:flex;gap:6px;align-items:center;color:var(--ink);white-space:nowrap}
 label small{color:var(--dim);min-width:3.2em}
 select,input[type=number]{background:#0c1412;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
 input[type=number]{width:72px}
 input[type=range]{width:110px}
 button{background:#2a3a33;color:var(--ink);border:1px solid #4d6259;border-radius:4px;padding:4px 10px;cursor:pointer;touch-action:none;user-select:none}
 button:active{background:#3a4d44}
 #stats{padding:6px 16px;color:var(--dim);font-size:13px;flex:none}
 main{flex:1;min-height:0;display:flex}
 #wrap{overflow:auto;padding:0 16px 24px;flex:1;min-width:0}   /* the map scrolls here; the controls stay put */
 #stage{position:relative}
 .fit #stage{width:100%;max-width:864px}
 #stage canvas{image-rendering:pixelated;display:block;width:100%;height:auto}
 #map{cursor:crosshair}
 #hi{position:absolute;inset:0;height:100%!important;pointer-events:none}
 /* The texture list: every cell of the faction's two sheets, click to leave it out or bring it back. */
 aside{width:330px;flex:none;overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:10px 12px 24px}
 aside[hidden]{display:none}
 aside h2{font-size:14px;margin:0 0 4px;color:var(--accent)}
 aside h3{font-size:13px;margin:12px 0 4px;color:var(--ink)}
 aside p{margin:4px 0;color:var(--dim);font-size:12px}
 .sheet{display:grid;grid-template-columns:52px repeat(4,56px);gap:4px;align-items:center}
 .sheet .rowname{font-size:11px;color:var(--dim);line-height:1.2}
 .sheet .rowname.idle{opacity:.5}
 .cell{position:relative;padding:0;width:56px;height:56px;border-radius:3px;border:2px solid transparent;background:#46514b;overflow:hidden}
 .cell canvas{width:52px;height:52px;display:block;image-rendering:pixelated}
 .cell .n{position:absolute;left:2px;top:0;font-size:10px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
 .cell .k{position:absolute;right:2px;bottom:0;font-size:10px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
 .cell .tag{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;text-align:center;text-shadow:0 0 3px #000,0 0 3px #000}
 .cell.out canvas{opacity:.28}
 .cell.out .tag{color:#cfd6c6}
 .cell.kicked{border-color:var(--kick)} .cell.kicked .tag{color:var(--kick)}
 .cell.back{border-color:var(--back)} .cell.back .tag{color:var(--back)}
 .cell.idle{opacity:.45}
 .cell.sel{outline:2px solid #fff;outline-offset:1px}
 .cell.loud::after{content:'醒目';position:absolute;right:2px;top:0;font-size:9px;color:#ffd36a;text-shadow:0 0 2px #000,0 0 2px #000}
 #diff{width:100%;min-height:72px;margin-top:6px;background:#0c1412;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
 .tools{display:flex;gap:8px;margin-top:6px}
 @media (max-width:760px){main{flex-direction:column}aside{width:auto;max-height:45vh;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
 <h1>派系痕跡預覽（遊戲同一套畫法）</h1>
 <div class="row">
  <div class="group"><b>地圖</b>
   <label>派系 <select id="faction"><option value="loyalist">忠誠者</option><option value="rebel">叛軍</option><option value="swarm">蟲族</option></select></label>
   <label>種子 <input id="seed" type="number" value="8"></label>
   <label>樓層 <select id="floor"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label>
   <button id="reroll">換種子</button>
  </div>
  <div class="group"><b>分布</b>
   <label>密度 <input id="density" type="range" min="0" max="3" step="0.25"><small id="densityText"></small></label>
   <label>群聚 <input id="patchiness" type="range" min="0" max="1.5" step="0.25"><small id="patchText"></small></label>
   <label><input id="nearBoost" type="checkbox" checked> 蟲巢附近加倍</label>
  </div>
  <div class="group"><b>每一處</b>
   <label>最小尺寸 <input id="minScale" type="range" min="0.3" max="1" step="0.05"><small id="scaleText"></small></label>
   <label title="可以超出自己那一格多遠（格）；只會跨到同一類的地面，碰到牆或任何物件就切掉">錯位 <input id="spread" type="range" min="0" max="1" step="0.125"><small id="spreadText"></small></label>
  </div>
 </div>
 <div class="row">
  <div class="group"><b>圖層</b>
   <label><input id="on" type="checkbox" checked> 痕跡</label>
   <label><input id="floorL" type="checkbox" checked> 地板</label>
   <label><input id="faceL" type="checkbox" checked> 牆面</label>
  </div>
  <div class="group"><b>明度</b>
   <label>痕跡亮度 <input id="boost" type="range" min="0.4" max="1.6" step="0.1"><small id="boostText"></small></label>
   <label>畫面明度 <input id="brightness" type="range" min="70" max="130" step="5" value="100"><small id="brightText"></small></label>
  </div>
  <div class="group"><b>檢視</b>
   <label>視野 <select id="vision"><option value="all">全部看得到</option><option value="player">從玩家位置（含記憶）</option></select></label>
   <label><input id="units" type="checkbox"> 顯示敵人</label>
   <label><input id="mark" type="checkbox"> 標記位置</label>
   <label>縮放 <select id="zoom"><option value="fit">符合寬度</option><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select></label>
   <button id="peek" title="按住時隱藏痕跡">按住看原圖</button>
   <button id="save">存成 PNG</button>
   <button id="defaults">恢復遊戲設定</button>
   <button id="pickerToggle">隱藏材質清單</button>
  </div>
 </div>
</header>
<div id="stats">載入中…</div>
<main>
 <div id="wrap" class="fit"><div id="stage"><canvas id="map"></canvas><canvas id="hi"></canvas></div></div>
 <aside id="picker"></aside>
</main>
<script type="module">
import {Game,SIZE} from '../src/engine.js';
import {Renderer} from '../src/renderer.js';
import {DECAL_ATLAS,DECAL_PACKS,DECAL_TUNING,FACTION_PACKS,EXCLUDED_CELLS,LOUD_CELLS} from '../src/faction-decals.js';

const T=32,$=id=>document.getElementById(id),canvas=$('map'),hi=$('hi');let renderer=null,decals=null,peeking=false,busy=null,boxes=[],selected=null;
canvas.width=canvas.height=hi.width=hi.height=SIZE*T;
// Wait for load events, not decode(): a hidden tab can hold decode() back indefinitely. Three seconds at most per image.
const settle=img=>img.complete&&img.naturalWidth?Promise.resolve():new Promise(done=>{img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true});setTimeout(done,3000);});
const pct=n=>`${Math.round(n*100)}%`;

// Sliders start at the game's values (src/faction-decals.js DECAL_TUNING).
const SLIDERS={density:'density',patchiness:'patchiness',minScale:'minScale',spread:'spread',boost:'boost'};
const gameValues=()=>{for(const [id,k] of Object.entries(SLIDERS))$(id).value=DECAL_TUNING[k];for(const id of ['nearBoost','floorL','faceL','on'])$(id).checked=true;};
gameValues();

// The cells left out of each sheet: the game's list until the viewer changes it in the list (kept in this browser).
const STORE='faction-decal-lab:excluded',defaults=()=>Object.fromEntries(Object.entries(EXCLUDED_CELLS).map(([k,v])=>[k,[...v]]));
let excluded=(()=>{try{const v=JSON.parse(localStorage.getItem(STORE));if(v&&typeof v==='object')return {...defaults(),...v};}catch{}return defaults();})();
const keep=()=>{try{localStorage.setItem(STORE,JSON.stringify(excluded));}catch{}};
const isOut=(pack,cell)=>excluded[pack]?.includes(cell),wasOut=(pack,cell)=>EXCLUDED_CELLS[pack]?.includes(cell);

function tuning(){
 const t={...DECAL_TUNING};for(const [id,k] of Object.entries(SLIDERS))t[k]=Number($(id).value);
 t.nearBoost=$('nearBoost').checked?DECAL_TUNING.nearBoost:1;if(!$('floorL').checked)t.floor=0;if(!$('faceL').checked)t.face=0;return t;
}

async function render(){
 const faction=$('faction').value,seed=Number($('seed').value)||1,floor=Number($('floor').value),brightness=Number($('brightness').value),t=tuning();
 $('densityText').textContent=`×${t.density}`;$('patchText').textContent=t.patchiness?`×${t.patchiness}`:'平均';$('scaleText').textContent=pct(t.minScale);$('brightText').textContent=`${brightness}%`;$('boostText').textContent=pct(t.boost);$('spreadText').textContent=t.spread?`${t.spread} 格`:'格內';
 // The game's 畫面明度 is a CSS brightness filter over the whole screen (expansion.css), so the preview does the same.
 canvas.style.filter=brightness===100?'':`brightness(${brightness/100})`;
 const g=new Game(seed,[],0,'soldier','onyx','extraction',{facilityFaction:faction});
 if(floor>1){g.floor=floor;g.loadFloor();}
 if($('vision').value==='all'){g.seen=g.seen.map(r=>r.map(()=>true));g.visibleTiles=new Set(Array.from({length:SIZE*SIZE},(_,i)=>`${i%SIZE},${Math.floor(i/SIZE)}`));}
 else{g.reveal();g.seen=g.seen.map(r=>r.map(()=>true));}   // what the player sees now is bright; the rest is remembered
 if(!$('units').checked){g.enemies=[];g.allies=[];}
 // One renderer, with its own animation loop, resize and camera easing switched off, so the frame stays the whole map.
 renderer??=Object.assign(new Renderer(canvas,g),{frame:()=>{},resize:()=>{},updateCamera:()=>{}});
 const r=renderer;decals??=r.decals;r.game=g;canvas.width=canvas.height=SIZE*T;   // the constructor sized it to its on-screen box
 Object.assign(r,{tile:T,w:SIZE*T,h:SIZE*T,dpr:1,camera:{x:(SIZE-1)/2,y:(SIZE-1)/2},targetingEnabled:false,reduceMotion:true,effects:[]});
 await Promise.all([...r.terrainImages.values(),r.sprites,r.classSprites,r.aftermath].filter(Boolean).map(settle));
 decals.configure({tuning:t,exclude:excluded});
 r.decals=$('on').checked&&!peeking?decals:null;
 r.draw(1000);
 boxes=decals.pieces(g)?.boxes||[];
 // Marks: the decal's own tile (faint) and the box around its visible pixels before any cut (dashed where part was cut).
 if($('mark').checked&&!peeking){const c=r.ctx;c.save();c.lineWidth=1;for(const m of marks()){const col={floor:'#ffd36a',face:'#7fd6ff'}[m.o.layer];
  c.globalAlpha=.35;c.setLineDash([]);c.strokeStyle=col;c.strokeRect(m.home.x+.5,m.home.y+.5,m.home.w-1,m.home.h-1);
  c.globalAlpha=1;c.setLineDash(m.cut?[3,2]:[]);c.strokeRect(Math.round(m.seen.x)+.5,Math.round(m.seen.y)+.5,Math.max(1,Math.round(m.seen.w)-1),Math.max(1,Math.round(m.seen.h)-1));}c.restore();}
 const count=l=>boxes.filter(b=>b.o.layer===l).length,drifted=boxes.filter(({box:{vis:v}})=>v.x0<0||v.y0<0||v.x1>1||v.y1>1).length,cut=boxes.filter(b=>b.cut).length;
 $('stats').textContent=`${faction} · 種子 ${seed} · 第 ${floor} 層 · 痕跡 ${boxes.length} 處：地板 ${count('floor')}、牆面 ${count('face')}。`+
  `錯位：${drifted} 處超出自己那格，其中 ${cut} 處碰到牆或物件被切掉一部分。家具、掩體箱、油桶、蟲巢、終端機、補給箱、設施和出口都不蓋。`+
  ($('mark').checked?'標記：淡框是原本那格，實框是材質範圍（虛線＝有被切）；地板黃、牆面藍。':'')+'點地圖上的痕跡，右邊清單會標出它是哪一格。';
 window.__decalBoxes=boxes;
 drawPicker();highlight(selected);
}

// Pixel rectangles for each decal: its home and the box around its visible pixels before any cut.
function marks(){
 return boxes.map(({o,box,cut})=>{const r=decals.home(renderer,o),v=box.vis;return {o,cut,home:r,seen:{x:r.x+v.x0*r.w,y:r.y+v.y0*r.h,w:(v.x1-v.x0)*r.w,h:(v.y1-v.y0)*r.h}};});
}
// Outline every place a cell is used on the map (on its own canvas, so hovering never redraws the map).
function highlight(target){
 const c=hi.getContext('2d');c.clearRect(0,0,hi.width,hi.height);if(!target||!renderer)return;
 for(const m of marks()){if(m.o.pack!==target.pack||m.o.cell!==target.cell)continue;
  const x=Math.round(m.seen.x)-4,y=Math.round(m.seen.y)-4,w=Math.round(m.seen.w)+8,h=Math.round(m.seen.h)+8;
  c.lineWidth=4;c.strokeStyle='#000000aa';c.strokeRect(x,y,w,h);c.lineWidth=2;c.strokeStyle='#ffffff';c.strokeRect(x,y,w,h);}
}

const ROW_NAMES=['地板','牆面','牆頂素材<br>→地板','物件<br>（不用）'];
function drawPicker(){
 const box=$('picker'),faction=$('faction').value,uses=new Map(),atlas=renderer?.terrainImages.get(DECAL_ATLAS);
 for(const {o} of boxes)uses.set(`${o.pack}:${o.cell}`,(uses.get(`${o.pack}:${o.cell}`)||0)+1);
 box.innerHTML=`<h2>材質清單</h2><p>點一格：踢掉／放回（地圖馬上重畫）。滑過一格：地圖上用到它的地方會框起來。右下角數字是這張地圖用了幾次；「醒目」的出現機率是其他的三分之一。</p>`;
 for(const pack of FACTION_PACKS[faction]){
  const h=document.createElement('h3');h.textContent=pack;box.append(h);
  const grid=document.createElement('div');grid.className='sheet';box.append(grid);
  for(let row=0;row<4;row++){
   const name=document.createElement('div');name.className='rowname'+(row===3?' idle':'');name.innerHTML=ROW_NAMES[row];grid.append(name);
   for(let c=0;c<4;c++){
    const cell=row*4+c,out=isOut(pack,cell),was=wasOut(pack,cell),b=document.createElement('button');
    b.className=['cell',out&&'out',out&&!was&&'kicked',!out&&was&&'back',row===3&&'idle',LOUD_CELLS[pack]?.includes(cell)&&'loud',selected?.pack===pack&&selected?.cell===cell&&'sel'].filter(Boolean).join(' ');
    b.title=`${pack} #${cell}：${ROW_NAMES[row].replace('<br>','')}${out?(was?'，遊戲不用':'，你踢掉的'):was?'，你放回來的（遊戲不用）':''}`;
    const cv=document.createElement('canvas');cv.width=cv.height=32;const x=cv.getContext('2d');if(atlas?.complete)x.drawImage(atlas,DECAL_PACKS.indexOf(pack)*128+c*32,row*32,32,32,0,0,32,32);
    b.append(cv);b.insertAdjacentHTML('beforeend',`<span class="n">#${cell}</span>${uses.get(`${pack}:${cell}`)?`<span class="k">×${uses.get(`${pack}:${cell}`)}</span>`:''}${out?`<span class="tag">${was?'不用':'踢掉'}</span>`:was?'<span class="tag">放回</span>':''}`);
    b.addEventListener('click',()=>{const list=excluded[pack]??=[];excluded[pack]=out?list.filter(n=>n!==cell):[...list,cell].sort((a,b)=>a-b);keep();selected={pack,cell};redraw();});
    b.addEventListener('pointerenter',()=>highlight({pack,cell}));b.addEventListener('pointerleave',()=>highlight(selected));
    grid.append(b);
   }
  }
 }
 // What differs from the game, in a form that can be pasted back to Claude: cells and slider values.
 const kicked=[],back=[];for(const pack of DECAL_PACKS){const k=(excluded[pack]||[]).filter(n=>!wasOut(pack,n)),r=(EXCLUDED_CELLS[pack]||[]).filter(n=>!isOut(pack,n));if(k.length)kicked.push(`${pack} ${k.map(n=>'#'+n).join(' ')}`);if(r.length)back.push(`${pack} ${r.map(n=>'#'+n).join(' ')}`);}
 const t=tuning(),names={density:'密度',patchiness:'群聚',minScale:'最小尺寸',spread:'錯位',boost:'痕跡亮度'},changed=Object.entries(SLIDERS).filter(([,k])=>t[k]!==DECAL_TUNING[k]).map(([id,k])=>`${names[id]} ${t[k]}`);
 if(!$('nearBoost').checked)changed.push('蟲巢附近不加倍');
 const text=[kicked.length&&`踢掉：${kicked.join('；')}`,back.length&&`放回：${back.join('；')}`,changed.length&&`數值：${changed.join('、')}`].filter(Boolean).join('\n')||'目前和遊戲相同';
 box.insertAdjacentHTML('beforeend',`<h3>跟遊戲不同的地方（三個派系一起）</h3><textarea id="diff" readonly></textarea><div class="tools"><button id="copyDiff">複製</button><button id="resetDiff">清單恢復遊戲設定</button></div>`);
 $('diff').value=text;
 $('copyDiff').addEventListener('click',async()=>{$('diff').select();try{await navigator.clipboard.writeText(text);$('copyDiff').textContent='已複製';}catch{document.execCommand?.('copy');}});
 $('resetDiff').addEventListener('click',()=>{excluded=defaults();keep();redraw();});
}

// Controls redraw in order; a new request while one is drawing waits for it.
const redraw=()=>{busy=(busy||Promise.resolve()).then(render).catch(e=>{$('stats').textContent=`繪製失敗：${e.message}`;console.error(e);});return busy;};
for(const id of ['faction','seed','floor','density','patchiness','nearBoost','minScale','spread','on','floorL','faceL','boost','brightness','vision','units','mark'])$(id).addEventListener('input',redraw);
$('faction').addEventListener('input',()=>{selected=null;});
$('defaults').addEventListener('click',()=>{gameValues();redraw();});
$('zoom').addEventListener('input',()=>{const z=$('zoom').value;$('wrap').className=z==='fit'?'fit':'';$('stage').style.width=z==='fit'?'':`${SIZE*T*Number(z)}px`;});
$('reroll').addEventListener('click',()=>{$('seed').value=Math.floor(Math.random()*9999)+1;redraw();});
const peek=on=>{if(peeking===on)return;peeking=on;redraw();};
$('peek').addEventListener('pointerdown',()=>peek(true));for(const ev of ['pointerup','pointerleave','pointercancel'])$('peek').addEventListener(ev,()=>peek(false));
$('save').addEventListener('click',()=>{const a=document.createElement('a');a.download=`decals-${$('faction').value}-${$('seed').value}-${$('floor').value}.png`;a.href=canvas.toDataURL('image/png');a.click();});
$('pickerToggle').addEventListener('click',()=>{const p=$('picker');p.hidden=!p.hidden;$('pickerToggle').textContent=p.hidden?'顯示材質清單':'隱藏材質清單';});
// Clicking a decal on the map picks its cell in the list (the smallest box under the pointer wins).
canvas.addEventListener('click',e=>{
 if(!renderer)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height;
 const hit=marks().filter(m=>x>=m.seen.x-2&&x<=m.seen.x+m.seen.w+2&&y>=m.seen.y-2&&y<=m.seen.y+m.seen.h+2).sort((a,b)=>a.seen.w*a.seen.h-b.seen.w*b.seen.h)[0];
 selected=hit?{pack:hit.o.pack,cell:hit.o.cell}:null;drawPicker();highlight(selected);
 if(selected){$('picker').hidden=false;$('pickerToggle').textContent='隱藏材質清單';document.querySelector('.cell.sel')?.scrollIntoView({block:'nearest'});}
});
window.__renderDecalLab=redraw;window.__decalRenderer=()=>renderer;
redraw();
</script>
</body>
</html>
